name: Nightly Release

on:
  schedule:
    - cron: "0 0 * * *" # midnight GMT
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 0) Move/force the "nightly" tag to main and delete the prior GH release.
  prepare-nightly-release:
    name: Prepare nightly tag + delete prior release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set nightly tag to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git tag -f nightly origin/main
          git push -f origin nightly

      - name: Delete existing nightly release (if any)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete nightly --yes || true

  build-plugin:
    name: Build + sign nightly plugin image
    environment: staging
    needs: prepare-nightly-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing

    outputs:
      nightly_digest: ${{ steps.digest.outputs.nightly_digest }}
      nightly_ref: ${{ steps.meta.outputs.nightly_ref }}
      body_path: ${{ steps.notes.outputs.body_path }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: nightly
          fetch-depth: 0
          submodules: true

      - name: Show git version
        shell: bash
        run: |
          git describe --tags --always --dirty=-modified || echo "No git version available"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Optional but recommended: BuildKit cache for faster nightlies
      - name: Set up BuildKit cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.repository }}-nightly
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.repository }}-

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image ref
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "nightly_ref=${IMAGE}:nightly" >> "$GITHUB_OUTPUT"

      # Build multi-arch image (must contain /plugin.wasm inside the layer tar.gz to match your puller)
      - name: Build and push multi-arch plugin image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ steps.meta.outputs.nightly_ref }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move BuildKit cache (for next run)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Resolve nightly multi-arch digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail

          nightly_ref="${{ steps.meta.outputs.nightly_ref }}"
          nightly_digest="$(docker buildx imagetools inspect "$nightly_ref" --format '{{.Digest}}')"

          echo "nightly_digest=$nightly_digest" >> "$GITHUB_OUTPUT"
          echo "Resolved nightly digest: $nightly_digest"

      - name: Sign nightly manifest by digest (prevents retag “moving” signatures)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"
          cosign sign --yes "${IMAGE}@${{ steps.digest.outputs.nightly_digest }}"

      - name: Write release notes (with immutable digest)
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ github.repository }}"
          DIGEST="${{ steps.digest.outputs.nightly_digest }}"
          SHA="${GITHUB_SHA}"

          cat > release-body.md <<EOF
          Nightly build from \`main\`.

          Commit:
          - \`${SHA}\`

          Container image (tag):
          - \`${IMAGE}:nightly\`

          ✅ Immutable digest (recommended for pinning):
          - \`${IMAGE}@${DIGEST}\`

          All container images are signed with Cosign. Verify the **immutable digest** with:

          \`\`\`bash
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/nightly.yml@refs/heads/main" \
            --certificate-oidc-issuer-regexp "https://token.actions.githubusercontent.com" \
            ${IMAGE}@${DIGEST}
          \`\`\`
          EOF

          echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"

  publish-nightly-release:
    name: Publish nightly GitHub Release
    needs: build-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (for release-body file)
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: nightly
          fetch-depth: 0

      - name: Create new nightly release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: nightly
          name: Nightly build
          draft: false
          prerelease: true
          generate_release_notes: true
          preserve_order: true
          body_path: release-body.md
