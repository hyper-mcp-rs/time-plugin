name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-plugin:
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write # keyless signing
    outputs:
      tag_digest: ${{ steps.digest.outputs.tag_digest }}
      latest_digest: ${{ steps.digest.outputs.latest_digest }}
      tag_ref: ${{ steps.meta.outputs.tag_ref }}
      latest_ref: ${{ steps.meta.outputs.latest_ref }}
      body_path: ${{ steps.notes.outputs.body_path }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Show git version
        shell: bash
        run: |
          git describe --tags --always --dirty=-modified || echo "No git version available"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Optional but recommended for faster tag builds
      - name: Set up BuildKit cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.repository }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.repository }}-

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          echo "tag_ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_ref=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      # Build multi-arch image (must contain /plugin.wasm inside the layer tar.gz to match your puller)
      - name: Build and push multi-arch plugin image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ steps.meta.outputs.tag_ref }}
            ${{ steps.meta.outputs.latest_ref }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move BuildKit cache (for next run)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Resolve multi-arch digests
        id: digest
        shell: bash
        run: |
          set -euo pipefail

          tag_ref="${{ steps.meta.outputs.tag_ref }}"
          latest_ref="${{ steps.meta.outputs.latest_ref }}"

          tag_digest="$(docker buildx imagetools inspect "$tag_ref" --format '{{.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "$latest_ref" --format '{{.Digest}}')"

          echo "tag_digest=$tag_digest" >> "$GITHUB_OUTPUT"
          echo "latest_digest=$latest_digest" >> "$GITHUB_OUTPUT"

          echo "Resolved tag digest:    $tag_digest"
          echo "Resolved latest digest: $latest_digest"

      - name: Sign manifests by digest (prevents retag “moving” signatures)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}"

          cosign sign --yes "${IMAGE}@${{ steps.digest.outputs.tag_digest }}"
          cosign sign --yes "${IMAGE}@${{ steps.digest.outputs.latest_digest }}"

      - name: Write release notes (with immutable digest)
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG_DIGEST="${{ steps.digest.outputs.tag_digest }}"

          cat > release-body.md <<EOF
          Final release for \`${TAG}\`.

          Included:
          - Plugin image: \`${IMAGE}:${TAG}\`

          ✅ Immutable digest (recommended for pinning):
          - \`${IMAGE}@${TAG_DIGEST}\`

          All container images are signed with Cosign. Verify with:

          \`\`\`bash
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer-regexp "https://token.actions.githubusercontent.com" \
            ${IMAGE}@${TAG_DIGEST}
          \`\`\`
          EOF

          echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          preserve_order: true
          body_path: ${{ steps.notes.outputs.body_path }}
