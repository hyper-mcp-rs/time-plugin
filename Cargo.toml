[package]
name = "time"
version = "0.1.6"
edition = "2024"
description = "Time operations plugin for hyper-mcp - provides UTC time, time parsing, and time offset operations"
license = "Apache-2.0"
repository = "https://github.com/hyper-mcp-rs/hyper-mcp"
homepage = "https://github.com/hyper-mcp-rs/hyper-mcp"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.21"
base64-serde = "0.7"
chrono = { version = "0.4", features = ["serde"] }
extism-pdk = "1.4"
git-version = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.release]
publish = false
push = true
tag = true
tag-name = "v{{version}}"
