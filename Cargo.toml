[package]
name = "time"
version = "0.1.0"
edition = "2024"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.21"
base64-serde = "0.7"
chrono = { version = "0.4", features = ["serde"] }
extism-pdk = "1.4"
git-version = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
